schema = 1
id = "plotroom"
name = "Tern Plotroom"
version = "0.33.0"
description = "A Plotroom block for a live queue of GitHub pull requests, GitHub issues and Jira issues: one sidebar of typed views across repositories and Jira projects, with Browser links, worktrees and agents; and a Draft review block beside an agent that proposed a review."
icon = "merge"
host = "host.luau"
window = "window.luau"
styles = ["plotroom.css"]

[[blocks]]
id = "prs"
title = "Plotroom"
icon = "merge"
palette = false

[[blocks]]
id = "review"
title = "Draft review"
icon = "check"
palette = false

[[lenses]]
id = "pr-create"
match = ["gh pr create*"]

[[lenses]]
id = "pr-checks"
match = ["gh pr checks", "gh pr checks *"]

[[lenses]]
id = "git-push"
match = ["git push*"]


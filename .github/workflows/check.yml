name: check

# The portable gate: standalone Luau tests, luau-lsp strict types against the pinned Tern SDK
# snapshot, and the queue benchmark, on Linux x86_64 and macOS arm64 (the maintainers' platform, so
# the Darwin tool pins in scripts/check.py are exercised) under the oldest and a current Python.
# The isolated-Tern smoke needs the Tern app, which CI does not have: --ci reports it as NOT RUN
# (never green), so a merge needs a local `python3 scripts/check.py` pass (AGENTS.md, Testing & QA).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    name: portable (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Cache the pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plotroom-check
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/check.py') }}
      - name: Install the pinned tools (sha256-verified)
        run: python3 scripts/check.py tools
      - name: Run the portable gate
        run: python3 scripts/check.py --ci

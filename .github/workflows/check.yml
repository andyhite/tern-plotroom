name: check

# The portable gate: standalone Luau tests, luau-lsp strict types against the pinned Tern SDK
# snapshot, and the queue benchmark. The isolated-Tern smoke needs the Tern app, which CI does not
# have: --ci reports it as NOT RUN (never green) and run `python3 scripts/check.py` locally for it.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools (sha256-verified)
        run: python3 scripts/check.py tools
      - name: Run the portable gate
        run: python3 scripts/check.py --ci
